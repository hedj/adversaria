[package]
name = "memex"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
format = { version = "0.1.0", path = "../format" }
protocol = { version = "0.1.0", path = "../protocol" }
# ratatui lays the screen out in cells (crate::gui::cells); without its
# default crossterm backend, since the memex draws in a window.
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
serde_json = "1.0.154"
# Typed journal bodies (crate::body) derive their JSON. serde_json builds
# serde and serde_derive already, so no new crate enters the build.
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
# Plumbing rules (crate::plumb) are regular expressions, as Plan 9's are;
# regex is the standard crate for them. A new dependency of the build,
# though Cargo.lock listed it already (fancy-regex, not built here, uses it).
regex = "1.13.1"
# The window (crate::gui): winit for the window and the keyboard on X11 and
# Wayland, egui to paint, wgpu to draw it, pollster to wait for wgpu's setup.
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
winit = "0.30.13"
pollster = "0.4.0"
unicode-width = "0.2.3"
# The graphemes ratatui draws by (it depends on the same version), so a
# wrapped row is measured as it is drawn.
unicode-segmentation = "1.13.3"
