[package]
name = "format"
version = "0.1.0"
description = "The journal format: canonical JSON (RFC 8785), terms, records and hashes"
edition.workspace = true
license.workspace = true

[dependencies]
# Parsing journal lines. float_roundtrip: parse every float exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
# A struct for each kind of entry body (bodies.rs), read and written by
# derive. serde_derive is in the lock already, built for other crates.
serde = { version = "1", features = ["derive"] }
