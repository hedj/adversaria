[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
format = { version = "0.1.0", path = "../format" }
serde_json = "1.0.154"
syn = { version = "3.0.10", features = ["full", "visit"] }
# The pointer program, for the window test under Wayland: one virtual
# pointer kept on the seat. Both crates are already in Cargo.lock, through
# winit.
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
