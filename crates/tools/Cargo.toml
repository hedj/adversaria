[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
format = { version = "0.1.0", path = "../format" }
serde_json = "1.0.154"
syn = { version = "3.0.10", features = ["full", "visit"] }
# The pointer and keyboard programs, for the window test under Wayland
# (crate::seat): a virtual pointer and keyboard kept on the seat.
# wayland-client, wayland-protocols-wlr and xkbcommon-dl (which loads
# libxkbcommon, to compile the keyboard's keymap) were already in
# Cargo.lock through winit; wayland-protocols-misc, for the virtual
# keyboard, is new, from the same project and release.
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon-dl = "0.4.2"
